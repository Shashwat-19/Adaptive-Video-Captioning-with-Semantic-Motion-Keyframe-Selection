[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-video-captioning"
version = "0.1.0"
description = "Research tooling for adaptive semantic-motion video keyframe selection and captioning."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.3,<2.6",
    "transformers==4.45.2",
    "sentencepiece==0.2.0",
    "accelerate==0.34.2",
    "peft==0.12.0",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "opencv-python-headless==4.10.0.84",
    "Pillow==10.4.0",
    "matplotlib==3.9.2",
    "tqdm==4.66.5",
    "PyYAML==6.0.2",
    "nltk==3.9.1",
    "rouge-score==0.1.2",
]

[project.optional-dependencies]
finetuning = ["bitsandbytes==0.43.3 ; platform_system == 'Linux'"]
analysis = ["seaborn==0.13.2", "evaluate==0.4.3", "wordcloud==1.9.3"]
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
